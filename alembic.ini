# Alembic configuration template.
# At runtime, docker/entrypoint.sh generates /tmp/alembic.runtime.ini with resolved DB_URL.
# This file is kept for local development (alembic -c alembic.ini upgrade head).
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
# sqlalchemy.url is injected at runtime via entrypoint.sh
# Local default (override with DB_URL env or .env):
sqlalchemy.url = sqlite+pysqlite:////tmp/data/reelshort.sqlite3

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S